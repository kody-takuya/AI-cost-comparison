name: Update LLM pricing

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/update-pricing.mjs
      - run: npm test
      - name: Commit verified changes
        run: |
          if git diff --quiet -- data/pricing.json; then
            echo "Pricing is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pricing.json
          git commit -m "chore: update LLM pricing"
          git push
